name: Validate lab projects

on:
  push:
    paths:
      - "lab-03-zabbix/**"
      - "lab-05-sli-slo-sla/**"
      - "lab-06-07-quality-control/**"
      - "lab-08-09-quality-economics/**"
      - ".github/workflows/labs-validation.yml"
  pull_request:
    paths:
      - "lab-03-zabbix/**"
      - "lab-05-sli-slo-sla/**"
      - "lab-06-07-quality-control/**"
      - "lab-08-09-quality-economics/**"
      - ".github/workflows/labs-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Bash syntax
        run: |
          bash -n lab-03-zabbix/scripts/install_zabbix.sh
          bash -n lab-03-zabbix/scripts/check_services.sh

      - name: Compile Python scripts
        run: |
          python -m compileall -q lab-03-zabbix/scripts
          python -m compileall -q lab-06-07-quality-control/src
          python -m compileall -q lab-08-09-quality-economics/src

      - name: Test quality metrics
        run: python -m unittest discover -s lab-06-07-quality-control/tests -v

      - name: Test economics calculations
        run: python -m unittest discover -s lab-08-09-quality-economics/tests -v
